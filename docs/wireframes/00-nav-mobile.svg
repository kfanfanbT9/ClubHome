<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" font-family="sans-serif">
<title>공통 네비게이션 - 모바일(햄버거 메뉴)</title>
<rect x="0" y="0" width="340" height="300" fill="#ffffff"/>
  <rect x="20" y="20" width="300" height="40" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="45" font-size="15" text-anchor="start" font-weight="bold" fill="#111">색연필</text>
  <text x="300" y="45" font-size="15" text-anchor="end" font-weight="normal" fill="#111">[≡]</text>
  <text x="170" y="85" font-size="11" text-anchor="middle" font-weight="normal" fill="#666">(탭 시 펼쳐짐)</text>
  <rect x="20" y="100" width="300" height="160" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="130" font-size="13" text-anchor="start" font-weight="normal" fill="#111">게시판</text>
  <text x="40" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#111">연습실예약</text>
  <text x="40" y="190" font-size="13" text-anchor="start" font-weight="normal" fill="#111">마이페이지</text>
  <text x="40" y="220" font-size="13" text-anchor="start" font-weight="normal" fill="#111">관리자 (관리자만 노출)</text>
  <text x="40" y="250" font-size="13" text-anchor="start" font-weight="normal" fill="#111">로그아웃</text>
</svg>
