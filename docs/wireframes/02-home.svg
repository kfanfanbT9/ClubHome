<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif">
<title>홈 화면 (첫 화면)</title>
<rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="40" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="45" font-size="16" text-anchor="start" font-weight="bold" fill="#111">색연필</text>
  <text x="140" y="45" font-size="13" text-anchor="start" font-weight="normal" fill="#111">게시판</text>
  <text x="220" y="45" font-size="13" text-anchor="start" font-weight="normal" fill="#111">연습실예약</text>
  <text x="330" y="45" font-size="13" text-anchor="start" font-weight="normal" fill="#111">마이페이지</text>
  <text x="780" y="45" font-size="13" text-anchor="end" font-weight="normal" fill="#111">로그인</text>
  <rect x="20" y="80" width="760" height="300" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="160" font-size="20" text-anchor="middle" font-weight="normal" fill="#111">색소폰 동호회 "색연필"에 오신 것을</text>
  <text x="400" y="195" font-size="20" text-anchor="middle" font-weight="normal" fill="#111">환영합니다</text>
  <rect x="150" y="260" width="220" height="46" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="260.0" y="288.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">게시판 바로가기</text>
  <rect x="430" y="260" width="260" height="46" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="560.0" y="288.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">연습실 예약 바로가기</text>
</svg>
