<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
<title>관리자 메뉴 - 회원 등급 관리 화면</title>
<rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="30" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="40" font-size="13" text-anchor="start" font-weight="normal" fill="#111">색연필  ...  [관리자]</text>
  <rect x="20" y="50" width="760" height="30" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="70" font-size="13" text-anchor="start" font-weight="normal" fill="#111">관리자 &gt; 회원 등급 관리</text>
  <rect x="20" y="80" width="760" height="40" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="35" y="90" width="200" height="24" rx="2" fill="none" stroke="#666" stroke-width="1"/>
  <rect x="245" y="90" width="60" height="24" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="275.0" y="105.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">검색</text>
  <rect x="20" y="120" width="760" height="150" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="45" y="145" font-size="12" text-anchor="start" font-weight="bold" fill="#111">이름</text>
  <text x="150" y="145" font-size="12" text-anchor="start" font-weight="bold" fill="#111">이메일</text>
  <text x="350" y="145" font-size="12" text-anchor="start" font-weight="bold" fill="#111">현재등급</text>
  <text x="480" y="145" font-size="12" text-anchor="start" font-weight="bold" fill="#111">등급변경</text>
  <line x1="20" y1="155" x2="780" y2="155" stroke="#666" stroke-width="1"/>
  <text x="45" y="180" font-size="12" text-anchor="start" font-weight="normal" fill="#111">김색소</text>
  <text x="150" y="180" font-size="12" text-anchor="start" font-weight="normal" fill="#111">kim@ex.com</text>
  <text x="350" y="180" font-size="12" text-anchor="start" font-weight="normal" fill="#111">준회원</text>
  <rect x="480" y="164" width="80" height="22" rx="2" fill="none" stroke="#666" stroke-width="1"/>
  <text x="520" y="180" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">정회원 ▾</text>
  <rect x="570" y="164" width="60" height="22" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="600.0" y="178.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">저장</text>
  <text x="45" y="212" font-size="12" text-anchor="start" font-weight="normal" fill="#111">이연습</text>
  <text x="150" y="212" font-size="12" text-anchor="start" font-weight="normal" fill="#111">lee@ex.com</text>
  <text x="350" y="212" font-size="12" text-anchor="start" font-weight="normal" fill="#111">정회원</text>
  <rect x="480" y="196" width="80" height="22" rx="2" fill="none" stroke="#666" stroke-width="1"/>
  <text x="520" y="212" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">운영진 ▾</text>
  <rect x="570" y="196" width="60" height="22" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="600.0" y="210.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">저장</text>
  <rect x="20" y="280" width="760" height="60" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="305" font-size="12" text-anchor="start" font-weight="normal" fill="#111">등급 체계 관리: [준회원][정회원][운영진]</text>
  <rect x="560" y="293" width="100" height="24" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="610.0" y="308.85" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">+ 등급추가</text>
</svg>
