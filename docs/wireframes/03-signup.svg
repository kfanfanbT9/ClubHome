<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="sans-serif">
<title>회원가입 화면</title>
<rect x="0" y="0" width="800" height="460" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="40" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="45" font-size="16" text-anchor="start" font-weight="bold" fill="#111">색연필</text>
  <rect x="20" y="80" width="760" height="340" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="115" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">회원가입</text>
  <text x="60" y="168" font-size="13" text-anchor="start" font-weight="normal" fill="#111">이름</text>
  <rect x="200" y="150" width="460" height="32" rx="2" fill="none" stroke="#666" stroke-width="1"/>
  <text x="60" y="213" font-size="13" text-anchor="start" font-weight="normal" fill="#111">이메일(ID)</text>
  <rect x="200" y="195" width="460" height="32" rx="2" fill="none" stroke="#666" stroke-width="1"/>
  <text x="60" y="258" font-size="13" text-anchor="start" font-weight="normal" fill="#111">비밀번호</text>
  <rect x="200" y="240" width="460" height="32" rx="2" fill="none" stroke="#666" stroke-width="1"/>
  <text x="60" y="303" font-size="13" text-anchor="start" font-weight="normal" fill="#111">비밀번호확인</text>
  <rect x="200" y="285" width="460" height="32" rx="2" fill="none" stroke="#666" stroke-width="1"/>
  <text x="60" y="348" font-size="13" text-anchor="start" font-weight="normal" fill="#111">연락처</text>
  <rect x="200" y="330" width="460" height="32" rx="2" fill="none" stroke="#666" stroke-width="1"/>
  <rect x="340" y="385" width="120" height="40" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="400.0" y="409.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">가입하기</text>
  <text x="400" y="455" font-size="12" text-anchor="middle" font-weight="normal" fill="#666">이미 계정이 있으신가요? 로그인</text>
</svg>
