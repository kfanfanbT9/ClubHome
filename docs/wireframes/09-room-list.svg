<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="sans-serif">
<title>연습실 목록/예약현황 조회 화면</title>
<rect x="0" y="0" width="800" height="480" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="40" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="45" font-size="16" text-anchor="start" font-weight="bold" fill="#111">색연필</text>
  <text x="130" y="45" font-size="13" text-anchor="start" font-weight="normal" fill="#111">게시판</text>
  <text x="204" y="45" font-size="13" text-anchor="start" font-weight="bold" fill="#111">[연습실예약]</text>
  <text x="314" y="45" font-size="13" text-anchor="start" font-weight="normal" fill="#111">마이페이지</text>
  <text x="760" y="45" font-size="13" text-anchor="end" font-weight="normal" fill="#111">로그아웃</text>
  <rect x="20" y="80" width="760" height="40" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="105" font-size="13" text-anchor="start" font-weight="normal" fill="#111">연습실 선택: [ 1연습실 ▾ ]</text>
  <text x="400" y="105" font-size="13" text-anchor="start" font-weight="normal" fill="#111">날짜: [ 2026-09-09 ▾ ]</text>
  <rect x="20" y="120" width="760" height="210" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="45" y="140" font-size="11" text-anchor="start" font-weight="normal" fill="#666">하루 전체 예약현황 (30분 단위, 운영시간 09:00-22:00)</text>
  <line x1="20" y1="150" x2="780" y2="150" stroke="#666" stroke-width="1"/>

  <rect x="45" y="160" width="14" height="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="75" y="172" font-size="13" text-anchor="start" fill="#111">09:00-09:30</text>
  <text x="260" y="172" font-size="13" text-anchor="start" fill="#111">예약가능</text>

  <rect x="45" y="188" width="14" height="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="75" y="200" font-size="13" text-anchor="start" fill="#111">09:30-10:00</text>
  <text x="260" y="200" font-size="13" text-anchor="start" fill="#111">예약가능</text>

  <rect x="45" y="216" width="14" height="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="75" y="228" font-size="13" text-anchor="start" fill="#111">10:00-10:30</text>
  <text x="260" y="228" font-size="13" text-anchor="start" fill="#111">예약가능</text>

  <rect x="45" y="244" width="14" height="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="46" y1="245" x2="58" y2="257" stroke="#333" stroke-width="1.5"/>
  <line x1="58" y1="245" x2="46" y2="257" stroke="#333" stroke-width="1.5"/>
  <text x="75" y="256" font-size="13" text-anchor="start" fill="#111">10:30-11:00</text>
  <text x="260" y="256" font-size="13" text-anchor="start" fill="#111">예약불가 (김OO)</text>

  <rect x="45" y="272" width="14" height="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="75" y="284" font-size="13" text-anchor="start" fill="#111">11:00-11:30</text>
  <text x="260" y="284" font-size="13" text-anchor="start" fill="#111">예약가능</text>

  <text x="45" y="312" font-size="11" text-anchor="start" fill="#666">...  (스크롤로 나머지 시간대 확인)</text>

  <rect x="20" y="340" width="760" height="50" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="370" font-size="13" text-anchor="start" fill="#111">선택한 시간대: 09:00 ~ 10:30 (30분 단위 3슬롯)</text>
  <rect x="620" y="352" width="120" height="26" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="680" y="368.85" font-size="11" text-anchor="middle" fill="#111">예약 신청</text>

  <rect x="20" y="400" width="760" height="40" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="425" font-size="13" text-anchor="start" fill="#111">내 예약 내역 보기 &gt;</text>
