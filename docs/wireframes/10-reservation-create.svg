<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="sans-serif">
<title>예약 신청 화면</title>
<rect x="0" y="0" width="800" height="320" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="30" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="40" font-size="13" text-anchor="start" font-weight="normal" fill="#111">&lt; 연습실예약 - 예약 신청</text>
  <rect x="20" y="50" width="760" height="240" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="90" font-size="13" text-anchor="start" font-weight="normal" fill="#111">연습실</text>
  <text x="180" y="90" font-size="13" text-anchor="start" font-weight="normal" fill="#111">1연습실</text>
  <text x="60" y="125" font-size="13" text-anchor="start" font-weight="normal" fill="#111">날짜</text>
  <text x="180" y="125" font-size="13" text-anchor="start" font-weight="normal" fill="#111">2026-09-09</text>
  <text x="60" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#111">선택 시간대</text>
  <text x="180" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#111">09:00 ~ 10:30 (30분 단위 3슬롯 연속)</text>
  <text x="60" y="200" font-size="12" text-anchor="start" font-weight="normal" fill="#666">※ 선택 구간 내 슬롯 중 하나라도 이미 예약되어 있으면</text>
  <text x="60" y="218" font-size="12" text-anchor="start" font-weight="normal" fill="#666">   신청 전체가 거부됩니다.</text>
  <rect x="340" y="245" width="110" height="40" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="395.0" y="269.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">예약 확정</text>
  <rect x="470" y="245" width="90" height="40" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="515.0" y="269.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">취소</text>
</svg>
