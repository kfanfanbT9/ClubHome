<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="sans-serif">
<title>게시판 목록 화면</title>
<rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="40" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="45" font-size="16" text-anchor="start" font-weight="bold" fill="#111">색연필</text>
  <text x="130" y="45" font-size="13" text-anchor="start" font-weight="bold" fill="#111">[게시판]</text>
  <text x="204" y="45" font-size="13" text-anchor="start" font-weight="normal" fill="#111">연습실예약</text>
  <text x="314" y="45" font-size="13" text-anchor="start" font-weight="normal" fill="#111">마이페이지</text>
  <text x="760" y="45" font-size="13" text-anchor="end" font-weight="normal" fill="#111">로그아웃</text>
  <rect x="20" y="80" width="760" height="240" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="115" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">게시판 목록</text>
  <text x="60" y="150" font-size="13" text-anchor="start" font-weight="normal" fill="#111">[자유게시판]</text>
  <text x="320" y="150" font-size="13" text-anchor="start" font-weight="normal" fill="#111">전체 이용가능</text>
  <text x="720" y="150" font-size="13" text-anchor="end" font-weight="normal" fill="#111">&gt;</text>
  <text x="60" y="182" font-size="13" text-anchor="start" font-weight="normal" fill="#111">[공지사항]</text>
  <text x="320" y="182" font-size="13" text-anchor="start" font-weight="normal" fill="#111">전체 이용가능</text>
  <text x="720" y="182" font-size="13" text-anchor="end" font-weight="normal" fill="#111">&gt;</text>
  <text x="60" y="214" font-size="13" text-anchor="start" font-weight="normal" fill="#111">[정회원 게시판] 🔒</text>
  <text x="320" y="214" font-size="13" text-anchor="start" font-weight="normal" fill="#111">정회원 이상 - 접근불가</text>
  <text x="720" y="214" font-size="13" text-anchor="end" font-weight="normal" fill="#111">(X)</text>
  <text x="60" y="246" font-size="13" text-anchor="start" font-weight="normal" fill="#111">[운영진 전용] 🔒</text>
  <text x="320" y="246" font-size="13" text-anchor="start" font-weight="normal" fill="#111">운영진 이상 - 접근불가</text>
  <text x="720" y="246" font-size="13" text-anchor="end" font-weight="normal" fill="#111">(X)</text>
  <text x="60" y="293" font-size="12" text-anchor="start" font-weight="normal" fill="#666">※ 내 등급: 준회원</text>
</svg>
