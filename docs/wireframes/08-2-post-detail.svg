<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
<title>게시글 상세 화면</title>
<rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="30" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="40" font-size="13" text-anchor="start" font-weight="normal" fill="#111">&lt; 자유게시판</text>
  <rect x="20" y="50" width="760" height="280" rx="0" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="45" y="85" font-size="16" text-anchor="start" font-weight="bold" fill="#111">이번주 정기연습 안내</text>
  <text x="45" y="110" font-size="12" text-anchor="start" font-weight="normal" fill="#666">작성자: 김색소  |  작성일: 09-08  |  조회수: 34</text>
  <line x1="20" y1="125" x2="780" y2="125" stroke="#666" stroke-width="1"/>
  <text x="45" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#666">(게시글 본문 내용)</text>
  <line x1="20" y1="270" x2="780" y2="270" stroke="#666" stroke-width="1"/>
  <rect x="45" y="285" width="80" height="34" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="85.0" y="306.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">목록</text>
  <rect x="600" y="285" width="80" height="34" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="640.0" y="306.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">수정</text>
  <rect x="690" y="285" width="80" height="34" rx="6" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="730.0" y="306.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">삭제</text>
  <text x="400" y="320" font-size="11" text-anchor="middle" font-weight="normal" fill="#666">(작성자 본인/관리자만 노출)</text>
</svg>
