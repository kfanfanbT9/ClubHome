# |         |            | 예약/관리자 엔드포인트 및 공통 스키마 정의) |              |
# | 0.2.0   | 2026-09-09 | servers 블록 단일화(`/api` 서버 제거 -    | Kang SangSoo |
# |         |            | paths가 이미 `/api` 접두사를 포함해        |              |
# |         |            | `/api/api/...`로 해석되던 오류 수정),     |              |
# |         |            | ReservationSlot에 예약자 이름(memberName) |              |
# |         |            | 추가(8-plan BE-07 "예약자 표시 포함"·     |              |
