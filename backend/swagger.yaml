openapi: 3.0.3
info:
  title: 색연필 색소폰 동호회 홈페이지 API
  version: 0.2.0
  description: |
    색소폰 동호회 "색연필" 홈페이지 백엔드 API 명세.
    회원/등급/게시판/게시글/연습실/예약 6개 도메인과 인증(JWT Access+Refresh)을 다룬다.

    참고 문서 (근거):
    - `docs/2-PRD.md` (v0.7) — 기능 요구사항(F-ID), 인증 정책
    - `docs/1-domain-definition.md` (v0.6) — 엔티티·비즈니스 규칙(§6)
    - `docs/3-user-scenario.md` (v0.7) — 정상/예외 흐름
    - `docs/5-project-principle.md` (v0.4) — 네이밍/경로 규칙, 도메인 용어 매핑표
    - `docs/7-erd.md` (v0.5), `docs/schema.sql` — 필드/타입/제약조건
    - `docs/8-plan.md` (v0.3) — Task별 엔드포인트·완료조건(기대 상태코드)

    범위 제외: 자료실, 파일 업로드, 알림, 소셜 로그인, 회원 탈퇴 API, 계정상태 자동전이(F-04)·예약 자동완료(F-23) 배치 로직(P1, API 없음).

servers:
  - url: /
    description: |
      동일 호스트 루트. 아래 `paths`의 키가 이미 `/api` 접두사를 포함하므로
      서버 URL에는 접두사를 두지 않는다(도메인 리소스는 `/api/...`, 헬스체크는 `/health`로 해석된다).

tags:
  - name: Auth
    description: 회원가입/로그인/로그아웃/토큰 재발급 (F-01, F-02)
  - name: Members
    description: 본인 정보 조회/수정 (F-03)
  - name: Boards
    description: 게시판 목록/상세, 등급 기반 접근 제어 (F-10)
  - name: Posts
    description: 게시글 조회/작성/수정/삭제 (F-11, F-12)
  - name: PracticeRooms
    description: 연습실 목록·예약현황 조회 (F-20)
  - name: Reservations
    description: 예약 신청/취소/내 예약 내역 (F-21, F-22)
  - name: Admin
    description: 관리자 전용 - 회원등급/게시판/연습실/예약 관리 (F-30, F-31, F-32)
  - name: Ops
    description: 운영/헬스체크

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Ops]
      summary: 헬스체크
      description: DB 연결 상태를 포함한 서버 상태 확인. 인증 불필요.
      security: []
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: ok

  /api/auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입 (F-01)
      description: |
        이름/이메일(로그인ID)/비밀번호/연락처를 입력받아 회원을 생성한다.
        신규 회원에게는 기본 등급(최저 grade_level, 예: 준회원)이 자동 부여되며,
        비밀번호는 bcrypt 해시로 저장된다(응답에 password_hash를 포함하지 않는다).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: 로그인 (F-02)
      description: |
        이메일+비밀번호 인증 성공 시 Access Token(단기)과 Refresh Token(장기)을 발급한다.
        탈퇴(withdrawn) 계정은 로그인이 차단된다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공, 토큰 발급
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "401":
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 탈퇴(withdrawn) 계정으로 로그인 시도
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Access Token 재발급 (F-02)
      description: |
        Refresh Token 검증 후 새 Access Token을 발급한다.
        서버 측 토큰 저장소(화이트/블랙리스트)는 두지 않는다(ERD §4, 무상태 설계).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Access Token 재발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          description: 만료·위조된 Refresh Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃 (F-02)
      description: |
        서버 측 토큰 저장소가 없으므로 로그아웃은 클라이언트에 저장된 토큰 폐기를 기준으로 처리한다.
        본 엔드포인트는 로그아웃 처리 확인 응답만 반환한다.
      responses:
        "204":
          description: 로그아웃 처리 완료 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/members/me:
    get:
      tags: [Members]
      summary: 본인 정보 조회 (F-03)
      description: 로그인 회원 본인의 정보(이름·연락처·등급·가입일·계정상태)를 조회한다.
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Members]
      summary: 본인 정보 수정 (F-03)
      description: |
        이름·연락처만 수정 가능하다. 이메일(로그인ID)·회원등급·계정상태는 수정 대상에서 제외되며,
        해당 필드에 대한 변경 요청은 무시되거나 400으로 거부된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdateRequest"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/members/me/reservations:
    get:
      tags: [Reservations]
      summary: 내 예약 내역 조회 (F-22)
      description: |
        로그인 회원 본인의 예약 내역을 상태(reserved/completed/canceled)와 함께 조회한다.
        `roomId` 쿼리 파라미터로 연습실별 필터링이 가능하며, 미지정 시 전체 연습실의 예약이 반환된다.
      parameters:
        - name: roomId
          in: query
          required: false
          description: 연습실 ID로 필터링 (미지정 시 전체)
          schema:
            type: integer
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/boards:
    get:
      tags: [Boards]
      summary: 게시판 목록 조회 (F-10)
      description: |
        활성(is_active=true) 게시판 목록과 각 게시판의 이용가능 최소등급, 로그인 회원의
        접근 가능 여부(canAccess)를 함께 반환한다. 비활성 게시판은 일반 회원 목록에 노출되지 않는다.
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/boards/{boardId}:
    get:
      tags: [Boards]
      summary: 게시판 상세 조회 (F-10)
      description: |
        회원 등급(member.grade_level) >= 게시판 최소등급(board.min_grade_level) 및 is_active 여부를
        service 레이어에서 검증한다. 등급 미달 시 403, 비활성/존재하지 않는 게시판은 404로 거부한다.
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 등급 미달로 접근 거부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/boards/{boardId}/posts:
    get:
      tags: [Posts]
      summary: 게시글 목록 조회 (F-11)
      description: 게시판 접근 등급 조건을 충족해야 조회 가능하다(F-10 인가 재사용). 페이지네이션을 지원한다.
      parameters:
        - $ref: "#/components/parameters/BoardId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 등급 미달로 게시판 접근 거부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Posts]
      summary: 게시글 작성 (F-11)
      description: 게시판의 이용가능 최소등급을 충족하는 회원만 작성할 수 있다. 등급 미달 시 403.
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreateRequest"
      responses:
        "201":
          description: 작성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 등급 미달로 작성 거부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/posts/{postId}:
    get:
      tags: [Posts]
      summary: 게시글 상세 조회 (F-11)
      description: 상세 조회 시 조회수(view_count)가 1 증가한다. 소속 게시판의 등급 조건을 충족해야 한다.
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: 조회 성공 (조회수 1 증가 반영)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 등급 미달로 접근 거부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Posts]
      summary: 게시글 수정 (F-12)
      description: 작성자 본인 또는 관리자(is_admin=true)만 수정할 수 있다. 그 외 회원은 403으로 거부된다.
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdateRequest"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 작성자 본인 또는 관리자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Posts]
      summary: 게시글 삭제 (F-12)
      description: 작성자 본인 또는 관리자(is_admin=true)만 삭제할 수 있다. 그 외 회원은 403으로 거부된다.
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "204":
          description: 삭제 성공 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 작성자 본인 또는 관리자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/practice-rooms:
    get:
      tags: [PracticeRooms]
      summary: 연습실 목록 조회 (F-20)
      description: 활성(is_active=true) 연습실 목록을 운영시간·수용인원과 함께 반환한다. 비활성 연습실은 목록에서 제외된다.
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeRoom"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/practice-rooms/{roomId}/reservations:
    get:
      tags: [PracticeRooms]
      summary: 연습실 하루 예약현황 조회 (F-20)
      description: |
        지정한 날짜의 운영시간 전체를 30분 단위 슬롯으로 전개하여 각 슬롯의 예약 가능 여부를 반환한다.
        취소(canceled) 상태 예약이 걸린 슬롯은 "예약가능"으로 표시된다(재예약 가능, 도메인 정의서 §6).
        운영시간 외 시간대는 응답에 포함되지 않는다.
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: date
          in: query
          required: true
          description: 조회할 예약일자 (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomReservationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 존재하지 않거나 비활성인 연습실
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Reservations]
      summary: 예약 신청 (F-21)
      description: |
        비어있는 30분 단위 시간대를 연속으로 선택해 하나의 예약(시작~종료 구간)으로 신청한다.
        - 시작·종료 시각은 30분 경계(분이 0 또는 30)여야 하며 `start_time < end_time`이어야 한다.
        - 요청 구간은 연습실 운영시간(open_time~close_time) 내에 있어야 한다.
        - 선택 구간에 포함된 슬롯 중 하나라도 이미 유효 예약(reserved)이 있으면 전체 신청이 거부된다(부분 저장 없음).
        - service 레이어 트랜잭션(BEGIN → SELECT ... FOR UPDATE로 기존 예약 잠금 → 구간 겹침 검사 → INSERT → COMMIT)으로
          원자적으로 처리하며, 겹침 발견 시 ROLLBACK 후 409를 반환한다.
        - 비활성 연습실 또는 탈퇴 회원의 예약 요청은 거부된다.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreateRequest"
      responses:
        "201":
          description: 예약 확정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: 30분 경계 위반, 시간 순서 오류, 운영시간 외 요청 등 입력 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 비활성 연습실 또는 탈퇴 회원의 예약 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 존재하지 않는 연습실
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 선택 구간 내 슬롯 중 하나 이상이 이미 예약됨(전체 거부)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reservations/{reservationId}/cancel:
    patch:
      tags: [Reservations]
      summary: 예약 취소 (F-22)
      description: |
        예약자 본인이 요청한 경우 예약 시작 시각 이전에만 취소가 허용된다.
        관리자(is_admin=true)는 예약 시작 여부와 무관하게 취소할 수 있다(도메인 정의서 §6, 운영 목적 예외).
        취소된 예약은 상태(canceled)로 이력에 남고, 해당 시간대는 재예약이 가능해진다.
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 취소 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: 이미 취소되었거나 완료된 예약에 대한 취소 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 타인의 예약이거나(본인/관리자 아님), 이미 시작된 예약에 대한 일반 회원의 취소 시도
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/members:
    get:
      tags: [Admin]
      summary: 회원 목록·검색 (F-30)
      description: 관리자(is_admin=true)만 접근 가능. 이름/이메일 기준 검색을 지원한다.
      parameters:
        - name: q
          in: query
          required: false
          description: 이름 또는 이메일 검색어
          schema:
            type: string
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/members/{memberId}/grade:
    patch:
      tags: [Admin]
      summary: 회원 등급 변경 (F-30)
      description: 관리자만 접근 가능. 대상 회원의 회원등급을 변경한다. 변경 즉시(또는 다음 토큰 갱신 시) 새 등급 기준이 적용된다.
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberGradeId]
              properties:
                memberGradeId:
                  type: integer
                  description: 변경할 회원등급 ID
      responses:
        "200":
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/member-grades:
    get:
      tags: [Admin]
      summary: 회원등급 체계 조회 (F-30)
      description: 관리자만 접근 가능. 전체 등급 목록을 조회한다.
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberGrade"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin]
      summary: 회원등급 생성 (F-30)
      description: 관리자만 접근 가능. 등급명/서열(grade_level)/관리자 권한 여부를 지정해 새 등급을 생성한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberGradeRequest"
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberGrade"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 등급명 또는 등급서열(grade_level) 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/member-grades/{gradeId}:
    patch:
      tags: [Admin]
      summary: 회원등급 수정 (F-30)
      description: 관리자만 접근 가능. 등급명/설명/서열/관리자 권한 여부를 수정한다.
      parameters:
        - name: gradeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberGradeRequest"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberGrade"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 등급명 또는 등급서열(grade_level) 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/boards:
    get:
      tags: [Admin]
      summary: 게시판 목록 조회 - 관리자 (F-31)
      description: |
        관리자만 접근 가능. 비활성(is_active=false) 게시판까지 포함한 전체 목록을 반환한다.
        일반 회원용 `GET /api/boards`는 활성 게시판만 반환하므로, 사용여부 관리(와이어프레임 13번)에는 본 엔드포인트를 사용한다.
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin]
      summary: 게시판 생성 (F-31)
      description: 관리자만 접근 가능. 게시판명/설명/이용가능 최소등급(min_grade_level)/사용여부를 설정한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardRequest"
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/boards/{boardId}:
    patch:
      tags: [Admin]
      summary: 게시판 수정 (F-31)
      description: 관리자만 접근 가능. 최소등급·사용여부 변경은 F-10 접근 제어에 즉시 반영된다.
      parameters:
        - $ref: "#/components/parameters/BoardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardRequest"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: 게시판 삭제 (F-31)
      description: |
        관리자만 접근 가능. 해당 게시판에 게시글이 존재하면 FK RESTRICT 제약으로 인해
        삭제가 거부되며 이는 500이 아닌 409로 응답한다(8-plan.md BE-10 완료조건).
      parameters:
        - $ref: "#/components/parameters/BoardId"
      responses:
        "204":
          description: 삭제 성공 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 참조 중인 게시글이 있어 삭제 불가(FK RESTRICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/practice-rooms:
    get:
      tags: [Admin]
      summary: 연습실 목록 조회 - 관리자 (F-32)
      description: |
        관리자만 접근 가능. 비활성(is_active=false) 연습실까지 포함한 전체 목록을 반환한다.
        일반 회원용 `GET /api/practice-rooms`는 활성 연습실만 반환하므로, 사용여부 관리(와이어프레임 14번)에는 본 엔드포인트를 사용한다.
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeRoom"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin]
      summary: 연습실 등록 (F-32)
      description: 관리자만 접근 가능. 연습실명/위치/수용인원/운영시간/사용여부를 등록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeRoomRequest"
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeRoom"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/practice-rooms/{roomId}:
    patch:
      tags: [Admin]
      summary: 연습실 수정 (F-32)
      description: 관리자만 접근 가능. 수용인원·운영시간·사용여부 변경은 예약 화면에 즉시 반영된다.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeRoomRequest"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeRoom"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: 연습실 삭제 (F-32)
      description: |
        관리자만 접근 가능. 해당 연습실에 예약 이력이 존재하면 FK RESTRICT 제약으로 인해
        삭제가 거부되며 이는 500이 아닌 409로 응답한다(8-plan.md BE-10 완료조건).
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: 삭제 성공 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 참조 중인 예약 이력이 있어 삭제 불가(FK RESTRICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/reservations:
    get:
      tags: [Admin]
      summary: 예약 현황·내역 조회 (F-32)
      description: 관리자만 접근 가능. 연습실/날짜/회원 등 조건으로 전체 예약 현황·내역을 조회한다.
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
        - name: date
          in: query
          required: false
          description: 예약일자(YYYY-MM-DD)로 필터링
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/reservations/{reservationId}/cancel:
    patch:
      tags: [Admin]
      summary: 예약 강제 취소 (F-32)
      description: |
        관리자만 접근 가능. 예약 시작 여부와 무관하게 강제로 취소할 수 있다(운영 목적 예외,
        도메인 정의서 §4.2, §6). 일반 회원용 취소(`/api/reservations/{reservationId}/cancel`)와
        달리 시작 전 제약을 적용하지 않는다.
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 강제 취소 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BoardId:
      name: boardId
      in: path
      required: true
      schema:
        type: integer
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      required: false
      description: 페이지 번호 (1부터 시작, 기본값 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 페이지당 항목 수 (기본값 20)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 요청 형식/입력값 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 인증 실패 (토큰 없음, 만료, 위조)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 권한 없음 (등급 미달, 관리자 아님, 본인 리소스 아님 등)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 리소스가 존재하지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 리소스 상태 충돌 (중복, 겹침 등)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        code:
          type: string
          description: 애플리케이션 정의 에러 코드
          example: RESERVATION_SLOT_CONFLICT
        message:
          type: string
          description: 사용자에게 노출 가능한 에러 메시지
          example: 이미 예약된 시간대가 포함되어 있습니다.

    MemberGrade:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: 정회원
        description:
          type: string
          nullable: true
        gradeLevel:
          type: integer
          description: 등급 서열 (높을수록 상위 등급), member_grades.grade_level
          example: 20
        isAdmin:
          type: boolean
          description: 관리자 메뉴 접근 권한 여부, member_grades.is_admin

    MemberGradeRequest:
      type: object
      required: [name, gradeLevel]
      properties:
        name:
          type: string
          example: 정회원
        description:
          type: string
        gradeLevel:
          type: integer
          example: 20
        isAdmin:
          type: boolean
          default: false

    Member:
      type: object
      description: password_hash는 응답에 포함하지 않는다.
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
          nullable: true
        memberGradeId:
          type: integer
        memberGrade:
          $ref: "#/components/schemas/MemberGrade"
        accountStatus:
          type: string
          enum: [active, dormant, withdrawn]
          description: members.account_status
        joinedAt:
          type: string
          format: date-time
          description: members.joined_at

    SignupRequest:
      type: object
      required: [name, email, password, phone]
      properties:
        name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        phone:
          type: string
          maxLength: 20

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenPairResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        member:
          $ref: "#/components/schemas/Member"

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    MemberUpdateRequest:
      type: object
      description: 이름·연락처만 수정 가능. email/memberGradeId/accountStatus는 허용되지 않는다.
      properties:
        name:
          type: string
          maxLength: 50
        phone:
          type: string
          maxLength: 20

    Board:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        minGradeLevel:
          type: integer
          description: 이용가능 최소등급, boards.min_grade_level (member_grades.grade_level 참조)
        isActive:
          type: boolean
          description: 사용여부, boards.is_active
        canAccess:
          type: boolean
          description: 요청 회원의 접근 가능 여부 (grade_level 비교 결과, 목록 조회 시에만 포함)
          readOnly: true

    BoardRequest:
      type: object
      required: [name, minGradeLevel]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        minGradeLevel:
          type: integer
        isActive:
          type: boolean
          default: true

    Post:
      type: object
      properties:
        id:
          type: integer
        boardId:
          type: integer
        memberId:
          type: integer
          description: 작성자 회원ID, posts.member_id
        authorName:
          type: string
          description: 작성자 이름 (응답 편의용, DB 컬럼 아님)
          readOnly: true
        title:
          type: string
        content:
          type: string
        viewCount:
          type: integer
          description: posts.view_count
        createdAt:
          type: string
          format: date-time
          description: posts.created_at

    PostCreateRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string

    PostUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string

    PostListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer

    PracticeRoom:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
          nullable: true
        capacity:
          type: integer
          description: 수용인원, practice_rooms.capacity (> 0)
        openTime:
          type: string
          description: "운영 시작시간 (HH:mm), practice_rooms.open_time"
          example: "09:00"
        closeTime:
          type: string
          description: "운영 종료시간 (HH:mm), practice_rooms.close_time"
          example: "22:00"
        isActive:
          type: boolean
          description: 사용여부, practice_rooms.is_active

    PracticeRoomRequest:
      type: object
      required: [name, capacity, openTime, closeTime]
      properties:
        name:
          type: string
          maxLength: 100
        location:
          type: string
        capacity:
          type: integer
          minimum: 1
        openTime:
          type: string
          example: "09:00"
        closeTime:
          type: string
          example: "22:00"
        isActive:
          type: boolean
          default: true

    ReservationSlot:
      type: object
      description: 30분 단위 슬롯 하나의 예약 가능 여부
      properties:
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "09:30"
        isAvailable:
          type: boolean
          description: 예약 가능 여부 (유효 예약(reserved)이 없으면 true, 취소된 예약이 걸린 슬롯도 true)
        reservationId:
          type: integer
          nullable: true
          description: 해당 슬롯을 점유 중인 예약 ID (예약 가능한 경우 null)
        memberName:
          type: string
          nullable: true
          description: |
            해당 슬롯 예약자 이름 (응답 편의용 파생 필드, DB 컬럼 아님. 예약 가능한 경우 null).
            와이어프레임 9번 "예약불가 (김OO)" 표기용 (8-plan BE-07).
          readOnly: true

    RoomReservationsResponse:
      type: object
      properties:
        practiceRoomId:
          type: integer
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/ReservationSlot"

    Reservation:
      type: object
      properties:
        id:
          type: integer
        practiceRoomId:
          type: integer
          description: reservations.practice_room_id
        memberId:
          type: integer
          description: 예약자 회원ID, reservations.member_id
        reservationDate:
          type: string
          format: date
          description: 예약일자, reservations.reservation_date
        startTime:
          type: string
          description: "30분 단위 시작 시각 (HH:mm), reservations.start_time"
          example: "09:00"
        endTime:
          type: string
          description: "30분 단위 종료 시각 (HH:mm, 연속 슬롯 묶음), reservations.end_time"
          example: "10:30"
        reservationStatus:
          type: string
          enum: [reserved, completed, canceled]
          description: reservations.reservation_status
        createdAt:
          type: string
          format: date-time
          description: reservations.created_at

    ReservationCreateRequest:
      type: object
      required: [reservationDate, startTime, endTime]
      description: |
        startTime/endTime은 30분 경계(HH:00 또는 HH:30)여야 하며 startTime < endTime이어야 한다.
        선택 구간은 반드시 30분 단위 연속 슬롯이어야 하며, 연습실 운영시간 내에 있어야 한다.
      properties:
        reservationDate:
          type: string
          format: date
          example: "2026-09-20"
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "10:30"
